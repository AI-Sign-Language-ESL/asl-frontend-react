<!DOCTYPE html>
<html lang="en-us">

<head>

  <meta charset="utf-8">

  

  <title>Unity Web Player | tafa</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <link rel="stylesheet" href="TemplateData/style.css">

</head>

<body>

  <div id="unity-container" class="unity-desktop">

    <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>

    <div id="unity-loading-bar">

      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">

        <div id="unity-progress-bar-full"></div>

      </div>

    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">

      <div id="unity-logo-title-footer"></div>

      <div id="unity-fullscreen-button"></div>

      <div id="unity-build-title">
        tafa
      </div>

    </div>

  </div>

  <script>

    // =====================================
    // CANVAS
    // =====================================

    var canvas =
      document.querySelector(
        "#unity-canvas"
      );

    // =====================================
    // WARNING BANNER
    // =====================================

    function unityShowBanner(
      msg,
      type
    ) {

      var warningBanner =
        document.querySelector(
          "#unity-warning"
        );

      function updateBannerVisibility() {

        warningBanner.style.display =
          warningBanner.children.length
            ? 'block'
            : 'none';

      }

      var div =
        document.createElement(
          'div'
        );

      div.innerHTML = msg;

      warningBanner.appendChild(
        div
      );

      if (type == 'error') {

        div.style =
          'background: red; padding: 10px;';

      } else {

        if (type == 'warning') {

          div.style =
            'background: yellow; padding: 10px;';

        }

        setTimeout(function () {

          warningBanner.removeChild(
            div
          );

          updateBannerVisibility();

        }, 5000);

      }

      updateBannerVisibility();
    }

    // =====================================
    // BUILD CONFIG
    // =====================================

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/New folder.loader.js";

    var config = {

      arguments: [],

      dataUrl:
        buildUrl + "/New folder.data.gz",

      frameworkUrl:
        buildUrl + "/New folder.framework.js.gz",

      codeUrl:
        buildUrl + "/New folder.wasm.gz",

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "DefaultCompany",

      productName:
        "tafa",

      productVersion:
        "0.1.0",

      showBanner:
        unityShowBanner,

    };

    // =====================================
    // MOBILE
    // =====================================

    if (
      /iPhone|iPad|iPod|Android/i.test(
        navigator.userAgent
      )
    ) {

      var meta =
        document.createElement(
          'meta'
        );

      meta.name = 'viewport';

      meta.content =
        'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

      document
        .getElementsByTagName(
          'head'
        )[0]
        .appendChild(meta);

      document.querySelector(
        "#unity-container"
      ).className =
        "unity-mobile";

      canvas.className =
        "unity-mobile";

    } else {

      canvas.style.width =
        "1280px";

      canvas.style.height =
        "720px";

    }

    // =====================================
    // SHOW LOADING
    // =====================================

    document.querySelector(
      "#unity-loading-bar"
    ).style.display =
      "block";

    // =====================================
    // LOAD UNITY
    // =====================================

    var script =
      document.createElement(
        "script"
      );

    script.src =
      loaderUrl;

    script.onload = () => {

      createUnityInstance(

        canvas,

        config,

        (progress) => {

          document.querySelector(
            "#unity-progress-bar-full"
          ).style.width =
            100 * progress + "%";

        }

      ).then((unityInstance) => {

        // =================================
        // GLOBAL UNITY INSTANCE
        // =================================

        window.unityInstance =
          unityInstance;

        if (window.parent) {

          window.parent.unityInstance =
            unityInstance;

        }

        // =================================
        // UNITY READY
        // =================================

        window.unityReady = true;

        if (window.parent) {
          window.parent.postMessage(
            { type: "unityReady" },
            "*"
          );
        }

        console.log(
          "UNITY INSTANCE READY"
        );

        // =================================
        // FLUTTER BRIDGE
        // =================================

        window.receiveFlutterText =
          function (text) {

            console.log(
              "RECEIVED FROM FLUTTER:",
              text
            );

            // CHECK UNITY

            if (
              !window.unityInstance
            ) {

              console.warn(
                "UNITY INSTANCE NOT READY — queuing for retry"
              );

              setTimeout(function () {
                if (window.receiveFlutterText) {
                  window.receiveFlutterText(text);
                }
              }, 1000);

              return;
            }

            try {

              // CONVERT:
              // hello thanks yes
              //
              // TO:
              // ["hello","thanks","yes"]

              let animations =
                text
                  .trim()
                  .split(/\s+/);

              let json =
                JSON.stringify(
                  animations
                );

              console.log(
                "JSON SENT:",
                json
              );

              // SEND TO UNITY

              window.unityInstance.SendMessage(

                "tpose",

                "ReceiveAnimations",

                json

              );

              console.log(
                "MESSAGE SENT TO UNITY"
              );

            } catch (e) {

              console.error(
                "SEND FAILED:",
                e
              );

            }

          };

        // =================================
        // HIDE LOADER
        // =================================

        document.querySelector(
          "#unity-loading-bar"
        ).style.display =
          "none";

        // =================================
        // FULLSCREEN
        // =================================

        document.querySelector(
          "#unity-fullscreen-button"
        ).onclick = () => {

          unityInstance.SetFullscreen(
            1
          );

        };

      }).catch((message) => {

        alert(
          message
        );

      });

    };

    document.body.appendChild(
      script
    );

  </script>

</body>

</html>
