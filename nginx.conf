server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Unity WebGL MIME types ───────────────────────────────────────────────
    types {
        application/wasm wasm;
        application/octet-stream data;
    }

    # ─── Unity WebGL: .wasm.gz (gzip pre-compressed) ─────────────────────────
    location ~* \.wasm\.gz$ {
        types { }
        default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        gzip off;
    }

    # ─── Unity WebGL: .framework.js.gz (gzip pre-compressed) ─────────────────
    location ~* \.framework\.js\.gz$ {
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        gzip off;
    }

    # ─── Unity WebGL: .data.gz (gzip pre-compressed) ─────────────────────────
    location ~* \.data\.gz$ {
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        gzip off;
    }

    # ─── Unity WebGL: .wasm (uncompressed) ────────────────────────────────────
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        gzip off;
    }

    # ─── Unity WebGL: loader .js and other uncompressed .js ──────────────────
    location ~* /Build/.*\.js$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        gzip off;
    }

    # ─── Unity WebGL: .data (uncompressed) ────────────────────────────────────
    location ~* \.data$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        gzip off;
    }

    # ─── Unity directory: prevent SPA fallback ────────────────────────────────
    location /unity/ {
        try_files $uri $uri/ =404;
    }

    # ─── SPA fallback (React) ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
