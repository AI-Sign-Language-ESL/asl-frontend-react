server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Disable nginx from re-compressing already-compressed Unity files ──────
    gzip off;

    # ─── Unity WebGL: .wasm.gz ───────────────────────────────────────────────
    location ~* \.wasm\.gz$ {
        default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip off;
    }

    # ─── Unity WebGL: .framework.js.gz ───────────────────────────────────────
    location ~* \.framework\.js\.gz$ {
        default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip off;
    }

    # ─── Unity WebGL: .data.gz ───────────────────────────────────────────────
    location ~* \.data\.gz$ {
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip off;
    }

    # ─── Unity WebGL: .wasm (uncompressed) ───────────────────────────────────
    location ~* \.wasm$ {
        default_type application/wasm;
        gzip off;
    }

    # ─── Unity WebGL: loader .js ─────────────────────────────────────────────
    location ~* /Build/.*\.js$ {
        default_type application/javascript;
        gzip off;
    }

    # ─── Unity iframe entry point – serve the real file, never SPA fallback ──
    location = /unity/index.html {
        try_files $uri =404;
    }

    # ─── SPA fallback (React) ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
